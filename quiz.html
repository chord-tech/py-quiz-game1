<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Py Quiz — Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --surface: #111113;
      --surface-2: #18181b;
      --border: #27272a;
      --border-strong: #3f3f46;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-muted: rgba(99, 102, 241, 0.15);
      --success: #22c55e;
      --error: #ef4444;
      --warning: #eab308;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 8px 40px -12px rgba(0,0,0,0.55);
      --page-pad-x: 16px;
      --page-pad-y: 20px;
      --wrap-width: 100%;
      --panel-pad: 20px 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      padding: var(--page-pad-y) var(--page-pad-x) 48px;
      -webkit-font-smoothing: antialiased;
    }
    .bg-mesh {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 70% 45% at 50% -10%, rgba(99,102,241,0.14), transparent);
    }
    .wrap {
      position: relative; z-index: 1;
      width: var(--wrap-width);
      max-width: 100%;
      margin: 0 auto;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(145deg, #6366f1, #4f46e5);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .mark svg { width: 20px; height: 20px; }
    .header h1 { font-size: 1rem; font-weight: 600; letter-spacing: -0.02em; }
    .header .sub {
      font-size: 0.8125rem; color: var(--text-tertiary); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px;
    }
    .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .timer {
      font-variant-numeric: tabular-nums; font-size: 0.875rem; font-weight: 600;
      padding: 10px 14px; border-radius: 8px; background: var(--surface-2);
      border: 1px solid var(--border); min-width: 64px; text-align: center;
    }
    .timer.warn { color: var(--warning); border-color: rgba(234,179,8,0.4); }
    .timer.danger { color: var(--error); border-color: rgba(239,68,68,0.45); animation: blink 0.7s ease infinite; }
    @keyframes blink { 50% { opacity: 0.7; } }
    .btn {
      height: 40px; padding: 0 16px; border-radius: 8px; font-family: var(--font);
      font-size: 0.875rem; font-weight: 600; cursor: pointer; border: 1px solid transparent;
    }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-secondary); }
    .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: var(--panel-pad); box-shadow: var(--shadow);
    }
    .progress-block { margin-bottom: 16px; }
    .progress-row {
      display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px;
      font-size: 0.8125rem; font-weight: 500; color: var(--text-tertiary); flex-wrap: wrap;
    }
    .track { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
    .track > div { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s ease; }
    .steps { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
    .step { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); }
    .step.done { background: var(--primary); }
    .step.active { background: var(--text); transform: scale(1.35); box-shadow: 0 0 0 3px var(--primary-muted); }
    .q-label {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--primary); margin-bottom: 10px;
    }
    .q-title {
      font-size: clamp(1.1rem, 2.2vw, 1.35rem); font-weight: 600; letter-spacing: -0.025em;
      line-height: 1.45; margin-bottom: 22px; word-break: break-word;
    }
    .choices { display: flex; flex-direction: column; gap: 10px; }
    .choice {
      display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px; cursor: pointer;
      min-height: 56px;
    }
    .choice:hover { border-color: var(--border-strong); background: var(--surface-2); }
    .choice.selected { border-color: var(--primary); background: var(--primary-muted); box-shadow: 0 0 0 1px var(--primary); }
    .choice input { display: none; }
    .choice .key {
      width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2);
      border: 1px solid var(--border); display: grid; place-items: center;
      font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); flex-shrink: 0;
    }
    .choice.selected .key { background: var(--primary); border-color: var(--primary); color: white; }
    .choice .label { font-size: 1rem; line-height: 1.45; padding-top: 3px; word-break: break-word; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 28px;
    }
    .actions .btn { height: 52px; width: 100%; font-size: 0.9375rem; }
    .result-hero { text-align: center; padding: 12px 0 24px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    .result-ring {
      width: 100px; height: 100px; margin: 0 auto 16px; border-radius: 50%;
      background: conic-gradient(var(--primary) var(--pct, 0%), var(--border) 0);
      display: grid; place-items: center; position: relative;
    }
    .result-ring::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--surface); }
    .result-ring span { position: relative; font-size: 1.35rem; font-weight: 700; }
    .result-hero h2 { font-size: clamp(1.35rem, 2.5vw, 1.65rem); font-weight: 700; letter-spacing: -0.03em; }
    .result-hero p { margin-top: 8px; font-size: 0.9375rem; color: var(--text-secondary); }
    .result-row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 14px 4px; border-bottom: 1px solid var(--border); font-size: 0.9375rem;
    }
    .result-row:last-child { border-bottom: none; }
    .tag-ok { color: var(--success); font-weight: 600; font-size: 0.875rem; flex-shrink: 0; }
    .tag-no { color: var(--error); font-weight: 600; font-size: 0.875rem; flex-shrink: 0; }
    .state { text-align: center; padding: 48px 24px; color: var(--text-secondary); font-size: 0.9375rem; }
    .state a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .hidden { display: none !important; }

    @media (min-width: 560px) {
      :root { --page-pad-x: 20px; --panel-pad: 28px; }
      .header .sub { max-width: 260px; }
    }

    /* Laptop and up: 90% of screen width */
    @media (min-width: 768px) {
      :root {
        --page-pad-x: 0;
        --page-pad-y: 32px;
        --wrap-width: 90%;
        --panel-pad: 32px 36px;
      }
    }

    @media (min-width: 1024px) {
      :root {
        --page-pad-y: 40px;
        --wrap-width: 90%;
        --panel-pad: 36px 44px;
      }
      .choice { padding: 18px 20px; }
    }

    @media (max-width: 380px) {
      .header-right .btn-ghost { padding: 0 10px; }
      .actions { gap: 8px; }
      .actions .btn { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="bg-mesh" aria-hidden="true"></div>
  <div class="wrap">
    <header class="header">
      <div class="header-left">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div>
          <h1>Python challenge</h1>
          <div class="sub" id="userLabel">Loading…</div>
        </div>
      </div>
      <div class="header-right">
        <div class="timer hidden" id="timer" aria-live="polite">5:00</div>
        <button type="button" class="btn btn-ghost" id="logoutBtn">Sign out</button>
      </div>
    </header>

    <div id="loading" class="panel state">Loading challenge…</div>
    <div id="authError" class="panel state hidden">
      Session expired or not signed in.<br /><br />
      <a href="/">Go to sign in</a>
    </div>

    <div id="quizArea" class="hidden">
      <div class="progress-block">
        <div class="progress-row">
          <span id="progressLabel">Question 1 of 10</span>
          <span id="answeredCount">0 answered</span>
        </div>
        <div class="track"><div id="progressBar"></div></div>
      </div>
      <div class="steps" id="steps" aria-hidden="true"></div>
      <div class="panel">
        <div class="q-label" id="qNum">Question 1</div>
        <div class="q-title" id="qText"></div>
        <div class="choices" id="options"></div>
        <div class="actions">
          <button type="button" class="btn btn-ghost" id="prevBtn">Back</button>
          <button type="button" class="btn btn-primary" id="nextBtn">Continue</button>
        </div>
      </div>
    </div>

    <div id="resultArea" class="hidden">
      <div class="panel">
        <div class="result-hero">
          <div class="result-ring" id="resultRing" style="--pct: 0%">
            <span id="scorePct">0%</span>
          </div>
          <h2 id="scoreBig">0 / 10</h2>
          <p id="scoreMsg"></p>
          <p id="timeMsg" style="margin-top: 4px; font-size: 0.8125rem; color: var(--text-tertiary)"></p>
        </div>
        <div id="resultList"></div>
        <div class="actions" style="margin-top: 20px">
          <button type="button" class="btn btn-primary" id="retryBtn">Retry</button>
          <button type="button" class="btn btn-ghost" id="homeBtn">Home</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const QUIZ_SECONDS = 5 * 60;
    let questions = [];
    let current = 0;
    let answers = {};
    let timeLeft = QUIZ_SECONDS;
    let timerId = null;
    let submitting = false;
    const params = new URLSearchParams(location.search);
    let level = ['easy','medium','hard','mixed'].includes(params.get('level')) ? params.get('level') : 'easy';
    const levelName = () => level.charAt(0).toUpperCase() + level.slice(1);

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
    function formatTime(secs) {
      return Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
    }
    function updateTimerDisplay() {
      const el = document.getElementById('timer');
      el.textContent = formatTime(timeLeft);
      el.classList.remove('warn', 'danger');
      if (timeLeft <= 30) el.classList.add('danger');
      else if (timeLeft <= 60) el.classList.add('warn');
    }
    function startTimer() {
      stopTimer();
      timeLeft = QUIZ_SECONDS;
      document.getElementById('timer').classList.remove('hidden');
      updateTimerDisplay();
      timerId = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) { stopTimer(); submitQuiz(true); }
      }, 1000);
    }
    function stopTimer() {
      if (timerId) { clearInterval(timerId); timerId = null; }
    }
    function renderSteps() {
      document.getElementById('steps').innerHTML = questions.map((q, i) => {
        let cls = 'step';
        if (i === current) cls += ' active';
        else if (answers[String(q.id)]) cls += ' done';
        return '<span class="' + cls + '"></span>';
      }).join('');
    }
    async function checkAuth() {
      try {
        const res = await fetch('/api/me', { credentials: 'same-origin' });
        const data = await res.json();
        if (!data.logged_in) {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('authError').classList.remove('hidden');
          return false;
        }
        document.getElementById('userLabel').textContent = data.username;
        return true;
      } catch {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('authError').classList.remove('hidden');
        return false;
      }
    }
    async function loadQuestions() {
      const res = await fetch('/api/quiz/questions?level=' + level, { credentials: 'same-origin' });
      if (res.status === 401) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('authError').classList.remove('hidden');
        return;
      }
      const data = await res.json();
      questions = data.questions;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('quizArea').classList.remove('hidden');
      renderQuestion();
      startTimer();
    }
    function renderQuestion() {
      const q = questions[current];
      const answered = Object.keys(answers).length;
      document.getElementById('qNum').textContent = 'Question ' + (current + 1);
      document.getElementById('qText').textContent = q.question;
      document.getElementById('progressLabel').textContent = 'Question ' + (current + 1) + ' of ' + questions.length + ' · ' + levelName();
      document.getElementById('answeredCount').textContent = answered + ' answered';
      document.getElementById('progressBar').style.width = ((current + 1) / questions.length * 100) + '%';
      renderSteps();
      const opts = document.getElementById('options');
      opts.innerHTML = '';
      for (const [letter, text] of Object.entries(q.options)) {
        const selected = answers[String(q.id)] === letter;
        const el = document.createElement('label');
        el.className = 'choice' + (selected ? ' selected' : '');
        el.innerHTML = '<input type="radio" name="q" value="' + letter + '" ' + (selected ? 'checked' : '') + ' />' +
          '<span class="key">' + letter.toUpperCase() + '</span>' +
          '<span class="label">' + escapeHtml(text) + '</span>';
        el.addEventListener('click', () => { answers[String(q.id)] = letter; renderQuestion(); });
        opts.appendChild(el);
      }
      document.getElementById('prevBtn').disabled = current === 0;
      document.getElementById('nextBtn').textContent = current === questions.length - 1 ? 'Submit' : 'Continue';
    }
    async function submitQuiz(fromTimeout) {
      if (submitting) return;
      submitting = true;
      stopTimer();
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.disabled = true;
      nextBtn.textContent = fromTimeout ? 'Time up…' : 'Submitting…';
      const used = QUIZ_SECONDS - Math.max(0, timeLeft);
      try {
        const res = await fetch('/api/quiz/submit', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('quizArea').classList.add('hidden');
          document.getElementById('timer').classList.add('hidden');
          document.getElementById('resultArea').classList.remove('hidden');
          document.getElementById('scoreBig').textContent = data.score + ' / ' + data.total;
          document.getElementById('scorePct').textContent = Math.round(data.percentage) + '%';
          document.getElementById('resultRing').style.setProperty('--pct', data.percentage + '%');
          let msg = data.message;
          if (fromTimeout) msg = 'Time ran out. ' + msg;
          document.getElementById('scoreMsg').textContent = msg;
          document.getElementById('timeMsg').textContent = 'Time used: ' + formatTime(used) + ' of ' + formatTime(QUIZ_SECONDS);
          document.getElementById('resultList').innerHTML = data.results.map(r =>
            '<div class="result-row"><span>Question ' + r.number + '</span><span class="' +
            (r.correct ? 'tag-ok' : 'tag-no') + '">' +
            (r.correct ? 'Correct' : 'Answer ' + r.correct_answer.toUpperCase()) +
            '</span></div>'
          ).join('');
        } else {
          alert(data.error || 'Submit failed');
          nextBtn.disabled = false; nextBtn.textContent = 'Submit'; submitting = false;
        }
      } catch {
        alert('Could not reach server');
        nextBtn.disabled = false; nextBtn.textContent = 'Submit'; submitting = false;
      }
    }
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (current > 0) { current--; renderQuestion(); }
    });
    document.getElementById('nextBtn').addEventListener('click', async () => {
      if (current < questions.length - 1) { current++; renderQuestion(); return; }
      await submitQuiz(false);
    });
    document.getElementById('retryBtn').addEventListener('click', async () => {
      current = 0; answers = {}; submitting = false;
      document.getElementById('resultArea').classList.add('hidden');
      document.getElementById('nextBtn').disabled = false;
      await loadQuestions();
    });
    document.getElementById('homeBtn').addEventListener('click', () => {
      stopTimer();
      window.location.href = '/home';
    });
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      stopTimer();
      await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
      window.location.href = '/';
    });
    (async () => { if (await checkAuth()) await loadQuestions(); })();
  </script>
</body>
</html>
